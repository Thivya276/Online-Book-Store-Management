<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Change password')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container">
<div th:replace="~{fragments :: flash}"></div>
<nav th:replace="~{fragments :: adminnav}"></nav>
<h1>Change admin password</h1>
<form method="post" th:action="@{/admin/password}" class="form card" data-validate>
  <label>Current password<input name="current" type="password" required autocomplete="current-password"></label>
  <div class="two">
    <label>New password (8+ characters, letter and number)<input name="next" type="password" required minlength="8" autocomplete="new-password"></label>
    <label>Confirm new password<input name="confirm" type="password" required autocomplete="new-password"></label>
  </div>
  <div class="actions"><button class="btn">Change password</button></div>
</form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
