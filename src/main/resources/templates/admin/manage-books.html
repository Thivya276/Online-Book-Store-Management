<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Manage books')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container">
<div th:replace="~{fragments :: flash}"></div>
<nav th:replace="~{fragments :: adminnav}"></nav>
<div class="row"><h1>Manage books</h1><a class="btn" th:href="@{/books/add}">Add a book</a></div>
<div class="wrap"><table>
  <thead><tr><th>ID</th><th>Title</th><th>Genre</th><th>Price</th><th>Stock</th><th></th></tr></thead>
  <tbody><tr th:each="b : ${books}">
    <td th:text="${b.id}"></td><td><a th:href="@{/books/{id}(id=${b.id})}" th:text="${b.title}"></a><br><small class="muted" th:text="${b.author}"></small></td>
    <td th:text="${b.genre}"></td><td th:text="${'$' + #numbers.formatDecimal(b.price,1,2)}"></td><td><span th:replace="~{fragments :: stock(${b.stock})}"></span></td>
    <td class="actions"><a class="btn ghost sm" th:href="@{/books/{id}/edit(id=${b.id})}">Edit</a>
      <form th:action="@{/books/{id}/delete(id=${b.id})}" method="post" data-confirm="Delete this book and its reviews?"><button class="btn bad sm">Delete</button></form></td>
  </tr></tbody>
</table></div>
<p class="empty" th:if="${#lists.isEmpty(books)}">The shelves are empty. Add your first book.</p>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
