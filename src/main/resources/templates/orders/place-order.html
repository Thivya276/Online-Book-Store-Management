<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Cart')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container">
<div th:replace="~{fragments :: flash}"></div>
<h1>Your cart</h1>
<p class="empty" th:if="${#lists.isEmpty(items)}">Your cart is empty. <a th:href="@{/books}">Browse books</a> and add something you like.</p>
<th:block th:if="${!#lists.isEmpty(items)}">
<div class="wrap"><table>
  <thead><tr><th>Book</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr></thead>
  <tbody><tr th:each="i : ${items}">
    <td><a th:href="@{/books/{id}(id=${i.bookId})}" th:text="${i.title}"></a></td>
    <td th:text="${'$' + #numbers.formatDecimal(i.price,1,2)}"></td><td th:text="${i.qty}"></td><td th:text="${'$' + #numbers.formatDecimal(i.subtotal(),1,2)}"></td>
    <td><form th:action="@{/cart/remove}" method="post"><input type="hidden" name="bookId" th:value="${i.bookId}"><button class="btn bad sm">Remove</button></form></td>
  </tr></tbody>
  <tfoot><tr><th colspan="3">Total</th><th th:text="${'$' + #numbers.formatDecimal(total,1,2)}"></th><th></th></tr></tfoot>
</table></div>
<form th:if="${session.userId != null}" method="post" th:action="@{/orders/place}" class="form card" data-validate>
  <label>Shipping address<textarea name="address" rows="3" required maxlength="200" th:text="${address}"></textarea></label>
  <fieldset class="pay"><legend>Payment method</legend>
    <label class="opt"><input type="radio" name="paymentMethod" value="COD" checked> Cash on delivery</label>
    <label class="opt"><input type="radio" name="paymentMethod" value="UPI"> UPI (demo only, no real money moves)</label>
    <label class="opt"><input type="radio" name="paymentMethod" value="CARD"> Card (demo only, no real money moves)</label>
  </fieldset>
  <div class="actions"><button class="btn">Place order</button></div>
</form>
<p th:if="${session.userId == null}" class="card pad">Log in to place your order. <a class="btn" th:href="@{/login}">Log in</a> <a th:href="@{/register}">or create an account</a></p>
</th:block>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
