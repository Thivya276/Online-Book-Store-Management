<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Order details')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container">
<div th:replace="~{fragments :: flash}"></div>
<h1 th:text="'Order ' + ${order.id}"></h1>
<p>Placed <span th:text="${order.date}"></span> by <span th:text="${order.userName}"></span>. Status: <span th:replace="~{fragments :: status(${order.status})}"></span></p>
<div class="wrap"><table>
  <thead><tr><th>Book</th><th>Price</th><th>Qty</th><th>Subtotal</th></tr></thead>
  <tbody><tr th:each="i : ${order.items}"><td><a th:href="@{/books/{id}(id=${i.bookId})}" th:text="${i.title}"></a></td>
    <td th:text="${'$' + #numbers.formatDecimal(i.price,1,2)}"></td><td th:text="${i.qty}"></td><td th:text="${'$' + #numbers.formatDecimal(i.subtotal(),1,2)}"></td></tr></tbody>
  <tfoot><tr><th colspan="3">Total</th><th th:text="${'$' + #numbers.formatDecimal(order.total,1,2)}"></th></tr></tfoot>
</table></div>
<p><strong>Ships to:</strong> <span th:text="${order.address}"></span></p>
<p><strong>Payment:</strong> <span th:text="${order.paymentMethod} + ', ' + ${order.paymentStatus}"></span></p>
<div class="actions">
  <form th:if="${order.status == 'Pending' and session.userId != null and session.userId == order.userId}" th:action="@{/orders/{id}/cancel(id=${order.id})}" method="post" data-confirm="Cancel this order?"><button class="btn bad">Cancel order</button></form>
  <a class="btn ghost" th:href="${session.adminId != null} ? @{/admin/orders} : @{/orders}">Back to orders</a>
</div>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
