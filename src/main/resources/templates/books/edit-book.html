<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Edit book')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container">
<div th:replace="~{fragments :: flash}"></div>
<nav th:replace="~{fragments :: adminnav}"></nav>
<h1>Edit book</h1>
<form method="post" th:action="@{/books/{id}/edit(id=${book.id})}" class="form card" data-validate>
  <label>Title<input name="title" required maxlength="120" th:value="${book.title}"></label>
  <label>Author<input name="author" required maxlength="80" th:value="${book.author}"></label>
  <label>Genre<input name="genre" required maxlength="40" th:value="${book.genre}"></label>
  <div class="two">
    <label>Price (USD)<input name="price" type="number" min="0" step="0.01" required th:value="${book.price}"></label>
    <label>Stock<input name="stock" type="number" min="0" step="1" required th:value="${book.stock}"></label>
  </div>
  <label>Description<textarea name="description" rows="4" maxlength="600" th:text="${book.description}"></textarea></label>
  <div class="actions"><button class="btn">Save book</button><a class="btn ghost" th:href="@{/admin/books}">Cancel</a></div>
</form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
