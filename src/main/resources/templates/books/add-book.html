<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Add book')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container">
<div th:replace="~{fragments :: flash}"></div>
<nav th:replace="~{fragments :: adminnav}"></nav>
<h1>Add a book</h1>
<form method="post" th:action="@{/books/add}" class="form card" data-validate>
  <label>Title<input name="title" required maxlength="120"></label>
  <label>Author<input name="author" required maxlength="80"></label>
  <label>Genre<input name="genre" required maxlength="40"></label>
  <div class="two">
    <label>Price (USD)<input name="price" type="number" min="0" step="0.01" required></label>
    <label>Stock<input name="stock" type="number" min="0" step="1" required></label>
  </div>
  <label>Description<textarea name="description" rows="4" maxlength="600"></textarea></label>
  <div class="actions"><button class="btn">Save book</button><a class="btn ghost" th:href="@{/admin/books}">Cancel</a></div>
</form>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
