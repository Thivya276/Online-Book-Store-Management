<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body>
<nav th:replace="~{fragments :: navbar}"></nav>
<main class="container">
<div th:replace="~{fragments :: flash}"></div>
<h1>Log in</h1>
<form method="post" th:action="@{/login}" class="form card" data-validate>
  <label>Email<input name="email" type="email" required autocomplete="email"></label>
  <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
  <div class="actions"><button class="btn">Log in</button><a th:href="@{/register}">Create an account</a></div>
</form>
<p class="muted">Store staff? <a th:href="@{/admin/login}">Admin log in</a></p>
</main>
<footer th:replace="~{fragments :: footer}"></footer>
</body>
</html>
